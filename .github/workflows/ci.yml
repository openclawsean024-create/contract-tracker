name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_TARGET: pages

jobs:
  lint:
    name: Lint / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Verify build contains the React app (AC-001)
        run: |
          grep -q 'id="root"' dist/index.html
          ls dist/assets/*.js
          ! test -f dist/dashboard.html
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E (Playwright, local vite preview)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # M1 不部署（GOAL.md Out of scope）。push 到 main 不會觸發；只有 Sean 在 main 上手動執行
  # workflow_dispatch 時才會跑，且 repo 未啟用 Pages 時會在 Setup Pages 失敗。
  deploy:
    name: Deploy to pages (manual only)
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run build

      - name: Setup Pages
        if: env.DEPLOY_TARGET == 'pages'
        uses: actions/configure-pages@v5
      - name: Upload to Pages
        if: env.DEPLOY_TARGET == 'pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to Pages
        if: env.DEPLOY_TARGET == 'pages'
        id: deployment
        uses: actions/deploy-pages@v4
